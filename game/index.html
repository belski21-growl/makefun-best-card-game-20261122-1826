<!doctype html>
<html lang="en">
<head>

</style>
</head>

<canvas id="game" aria-label="Tideglass Duel: a card duel against Nereida, Rival of the Deep — play cards with tide, pair a suit for Surge, beat her stance for Counter"></canvas>

</html>
